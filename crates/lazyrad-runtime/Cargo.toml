[package]
name = "lazyrad-runtime"
description = "LazyRAD Rhai runtime: engine setup, stdlib, form instantiation and event binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["desktop", "metadata"]
# Everything that needs a desktop OS: the `winit` window backend (`run_project`,
# `run_runtime`, `run_empty_window`) and the local time zone offset. A LazyOS
# (musl, no windowing) build turns it off and passes its own backend to the
# `*_with` entry points; `xui-canvas` then links only the software painter.
desktop = ["xui-canvas/winit-backend", "time/local-offset"]
# Rhai function metadata (parameter names, doc comments) for the IDE's
# completion and signature help. The LazyOS player leaves it off.
metadata = ["rhai/metadata"]

[dependencies]
lazyrad-project.workspace = true
rhai.workspace = true
thiserror.workspace = true
time.workspace = true
xui-canvas.workspace = true
xui-core.workspace = true
xui-form.workspace = true
xui-rhai.workspace = true

