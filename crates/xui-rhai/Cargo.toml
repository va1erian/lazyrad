[package]
name = "xui-rhai"
description = "Script xui-form forms with Rhai: value conversion, control handles, the engine host and event binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xui-core.workspace = true
xui-form.workspace = true
rhai.workspace = true

[dev-dependencies]
# The scripted-form example opens a desktop window; the tests use the offscreen
# backend. `metadata` is checked by the engine tests.
rhai = { workspace = true, features = ["metadata", "internals"] }
xui-canvas = { workspace = true, features = ["winit-backend"] }
