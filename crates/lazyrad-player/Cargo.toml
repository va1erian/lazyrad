[package]
name = "lazyrad-player"
description = "The LazyRAD runtime host: runs a project dir, an exported payload, or a debug session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lazyrad-player"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lazyrad-packager.workspace = true
lazyrad-project.workspace = true
lazyrad-runtime.workspace = true
rfd.workspace = true
serde_json.workspace = true

[dev-dependencies]
editpe = { version = "0.2", default-features = false, features = ["std"] }
xui-canvas.workspace = true
xui-core.workspace = true

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"
