[package]
name = "lazyrad-player"
description = "The LazyRAD runtime host: runs a project dir, an exported payload, or a debug session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lazyrad-player"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
default = ["desktop", "native-dialogs"]
# The desktop `winit` window backend ([`run_cli`]) and the local time zone. LazyOS
# turns it off and calls `run_with_backend` with its own backend.
desktop = ["lazyrad-runtime/desktop", "dep:xui-canvas"]
# The native message box for an exported app that cannot start (`rfd`).
# Without it the platform seam falls back to stderr.
native-dialogs = ["dep:rfd", "dep:pollster"]

[dependencies]
lazyrad-packager.workspace = true
lazyrad-project.workspace = true
lazyrad-runtime.workspace = true
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serde_json.workspace = true
xui-canvas = { workspace = true, optional = true }
xui-core.workspace = true

[dev-dependencies]
editpe = { version = "0.2", default-features = false, features = ["std"] }
xui-canvas.workspace = true

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"
