[package]
name = "lazyrad-editor"
description = "The LazyRAD custom xui code-editor widget (buffer, view, highlighting, completion)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lazyrad-runtime.workspace = true
regex.workspace = true
rhai.workspace = true
ropey = "1"
xui-core.workspace = true

# The OS clipboard (PLAN.md §10, gap G2: xui has no portable clipboard). It is
# optional so a build can fall back to the in-process [`platform::Clipboard`],
# which is what the tests and LazyOS use.
arboard = { version = "3", optional = true }

[features]
default = ["system-clipboard"]
system-clipboard = ["dep:arboard"]

[dev-dependencies]
xui-canvas.workspace = true
