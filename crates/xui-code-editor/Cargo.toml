[package]
name = "xui-code-editor"
description = "A reusable xui code-editor widget: rope buffer, monospace view, pluggable highlighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
regex.workspace = true
ropey = "1"
xui-core.workspace = true
xui-scrollbar.workspace = true

# The OS clipboard. xui has no portable clipboard, so the editor copies and
# pastes through its own [`platform::Clipboard`] trait. This optional backend
# implements it with the OS clipboard; a build with `default-features = false`
# falls back to the in-process clipboard and needs no OS clipboard at all.
arboard = { version = "3", optional = true }

[features]
default = ["system-clipboard"]
# The system clipboard, backed by `arboard`.
system-clipboard = ["dep:arboard"]
# The hand-written, line-incremental Rhai lexer (`lexer::RhaiHighlighter`).
# It is off by default, so a plain-text editor carries no language rules.
rhai-syntax = []

[dev-dependencies]
xui-canvas.workspace = true
# Rhai's own tokenizer, the oracle the hand-written lexer's tests compare token
# boundaries against. The lexer itself never uses it, so `rhai-syntax` builds
# carry no Rhai crate either.
rhai.workspace = true
