[package]
name = "lazyrad-ide"
description = "The LazyRAD IDE shell: windows, menus, project explorer and wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lazyrad-ide"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
default = ["desktop"]
# Everything that needs a desktop OS: the `winit` window backend, the host
# platform (`platform::host`: config directory, OS theme) and the native dialogs.
# LazyOS builds with `default-features = false` and installs its own
# `lazyrad_runtime::platform::Platform` before `run_with_backend`.
desktop = [
    "native-dialogs",
    "dep:directories",
    "dep:dark-light",
    "lazyrad-runtime/desktop",
    "xui-canvas/winit-backend",
]
# OS file and message dialogs (`rfd`). Without it the host platform answers
# every dialog as a cancel (see `platform::dialogs`).
native-dialogs = ["dep:rfd", "dep:pollster"]

[dependencies]
directories = { workspace = true, optional = true }
lazyrad-designer.workspace = true
lazyrad-packager.workspace = true
lazyrad-player.workspace = true
lazyrad-project.workspace = true
lazyrad-runtime = { workspace = true, features = ["metadata"] }
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
xui-canvas.workspace = true
xui-code-editor = { workspace = true, features = ["rhai-syntax"] }
xui-core.workspace = true
xui-form.workspace = true

# System-theme detection. `dark-light` pulls a D-Bus stack on Linux, so it is
# only used on the platforms the IDE actually queries; elsewhere the "system"
# theme resolves to light.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
dark-light = { workspace = true, optional = true }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
serde_json.workspace = true
