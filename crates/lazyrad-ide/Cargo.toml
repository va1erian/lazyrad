[package]
name = "lazyrad-ide"
description = "The LazyRAD IDE shell: windows, menus, project explorer and wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lazyrad-ide"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["native-dialogs"]
# OS file and message dialogs (`rfd`). Without it the platform seam's headless
# fallback answers every dialog as a cancel (see `platform::dialogs`).
native-dialogs = ["dep:rfd"]

[dependencies]
directories.workspace = true
lazyrad-designer.workspace = true
lazyrad-packager.workspace = true
lazyrad-player.workspace = true
lazyrad-project.workspace = true
lazyrad-runtime.workspace = true
rfd = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
xui-canvas.workspace = true
xui-code-editor = { workspace = true, features = ["rhai-syntax"] }
xui-core.workspace = true
xui-form.workspace = true

# System-theme detection. `dark-light` pulls a D-Bus stack on Linux, so it is
# only used on the platforms the IDE actually queries; elsewhere the "system"
# theme resolves to light.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
dark-light.workspace = true

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
serde_json.workspace = true
