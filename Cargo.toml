# The LazyRAD workspace. See PLAN.md §2 for the layout and the reasoning behind
# each crate. `lazyrad-debug-proto` and `lazyrad-packager` join the members list
# when their milestones (M4 and M5) start.
[workspace]
resolver = "3"
members = [
    "crates/xui-form",
    "crates/xui-rhai",
    "crates/lazyrad-project",
    "crates/lazyrad-runtime",
    "crates/lazyrad-packager",
    "crates/lazyrad-player",
    "crates/lazyrad-designer",
    "crates/lazyrad-ide",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/va1erian/lazyrad"

[workspace.dependencies]
# The UI toolkit, pinned to the revision LazyOS builds against (PLAN.md §1).
# A `[patch]` for local xui fixes is kept at the bottom of this file.
xui-core = { git = "https://github.com/va1erian/xui", rev = "d36ed3660f98cf5c214afa0a0c14efbbe54c103d" }
xui-code-editor = { git = "https://github.com/va1erian/xui", rev = "d36ed3660f98cf5c214afa0a0c14efbbe54c103d" }
# `default-features = false`: the pure tiny-skia software painter core only, so a
# musl/LazyOS build links no windowing crate (winit, softbuffer, glutin, glow,
# arboard, xui-gpu). Desktop binaries and examples opt in with the
# `winit-backend` feature (see `lazyrad-runtime`'s `desktop` feature).
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "d36ed3660f98cf5c214afa0a0c14efbbe54c103d", default-features = false }

# The scripting language, pinned to the exact version LazyOS's `rhai-lazy` uses
# so one Rhai is audited and linked everywhere. `default-features = false` drops
# `ahash/runtime-rng`, so no `getrandom` is needed at startup on LazyOS. The
# player path needs only `std` and `debugging` (breakpoints and call stacks).
# `metadata` (completion and signature data) and `internals` (the tokenizer)
# are IDE/test-only and are enabled by the crates that use them, so the player
# stays small. `sync` is deliberately left off so the engine keeps `Rc`,
# matching xui's single-threaded widgets (PLAN.md §1).
rhai = { version = "=1.26.1", default-features = false, features = ["std", "debugging"] }

# Project and form files are plain TOML (PLAN.md §1, §3): serde derives the
# model, `toml` does the (de)serialisation, and `thiserror` types the errors
# that carry the file and, where possible, a line number.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"

# `now()` and `today()` report the local clock. Only the offset lookup and
# the core date/time types are needed; formatting is done by the runtime, so
# the macros and parsing features are left off (PLAN.md §4.4).
# `local-offset` is opt-in (the `desktop` feature of `lazyrad-runtime`): LazyOS
# has no zone database, so its player reports UTC.
time = { version = "0.3", default-features = false, features = ["std"] }

# The IDE shell persists its settings (theme, editor font, recent projects and
# pane sizes) as TOML in the OS config directory resolved by `directories`
# (PLAN.md §9). `dark-light` resolves the "system" theme choice.
directories = "6"
dark-light = "3"

# File and folder dialogs. xui has no portal dialogs (PLAN.md §10, gap G4), so
# the desktop IDE uses `rfd`; LazyOS will supply a painted dialog behind the
# same `platform::dialogs` module.
rfd = "0.17"

xui-form = { path = "crates/xui-form" }
xui-rhai = { path = "crates/xui-rhai" }
lazyrad-project = { path = "crates/lazyrad-project" }
lazyrad-runtime = { path = "crates/lazyrad-runtime", default-features = false }
lazyrad-packager = { path = "crates/lazyrad-packager" }
lazyrad-player = { path = "crates/lazyrad-player", default-features = false }
lazyrad-designer = { path = "crates/lazyrad-designer" }

# `#![forbid(unsafe_code)]` is also written at the top of every crate, so a
# module cannot opt out by dropping the workspace opt-in.
[workspace.lints.rust]
unsafe_code = "forbid"

# Uncomment to build against a local xui checkout while preparing an upstream
# fix (PLAN.md §2). The `[patch]` key matches the git dependency's URL exactly,
# and the patched crates take precedence over the pinned `rev`.
# [patch."https://github.com/va1erian/xui"]
# xui-core = { path = "../xui/crates/xui-core" }
# xui-canvas = { path = "../xui/crates/xui-canvas" }
# xui-code-editor = { path = "../xui/crates/xui-code-editor" }
